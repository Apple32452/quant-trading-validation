name: Python validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Black-Scholes numerical check
        run: python quant_models.py black-scholes
      - name: Synthetic backtest
        run: python quant_models.py backtest
      - name: Repeated synthetic overfitting smoke test
        run: python overfitting_study.py --repetitions 30 --candidate-counts 1,5,20 --seed 42
      - name: Historical-data backtest tests
        run: python -m unittest discover -s tests -p test_market_backtest.py -v
      - name: Synthetic factor-alpha and official-archive parser tests
        run: python -m unittest discover -s tests -p test_factor_alpha.py -v
      - name: Factor-alpha scripts compile without downloading data
        run: python -m py_compile fetch_factor_data.py factor_alpha.py
      - name: Preregistered cross-asset replication synthetic checks (no market data)
        run: python -m unittest discover -s tests -p test_cross_asset_replication.py -v
      - name: Frozen replication entrypoint compiles without peeking at returns
        run: python -m py_compile cross_asset_replication.py
      - name: Prospective paper trading synthetic clock and journal tests
        run: python -m unittest discover -s tests -p test_prospective_paper.py -v
      - name: Prospective tracker compiles without market data
        run: python -m py_compile prospective_paper.py
      - name: Small blackjack smoke test
        run: python quant_models.py blackjack --sessions 20 --decks 10
